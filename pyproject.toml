[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "Passive RF surveillance platform"
requires-python = ">=3.11"
dependencies = [
    "scapy>=2.5.0",
    "bleak>=0.21.0",
    "dbus-next>=0.2.3",
    "pyyaml>=6.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
sentinel = "sentinel.cli.main:cli"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
